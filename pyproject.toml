[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-sepsis-training"
version = "0.1.0"
description = "QLoRA do Qwen3 8B para experimento acadêmico de classificação horária de sepse"
requires-python = ">=3.12,<3.14"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

